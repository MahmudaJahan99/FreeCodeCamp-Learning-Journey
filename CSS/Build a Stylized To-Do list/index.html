<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <ul class="todo-list">
      <!-- Item 1 -->
      <li>
        <input type="checkbox" name="html" id="html" />
        <label for="html">Study HTML</label>
        <ul class="sub-item">
          <li>
            <a
              href="https://www.w3schools.com/html/"
              target="_blank"
              class="sub-item-link"
              >W3Schools HTML</a
            >
          </li>
        </ul>
      </li>

      <!-- Item 2 -->
      <li>
        <input type="checkbox" name="html" id="html" />
        <label for="html">Study CSS</label>
        <ul class="sub-item">
          <li>
            <a
              href="https://www.w3schools.com/css/"
              target="_blank"
              class="sub-item-link"
              >W3Schools CSS</a
            >
          </li>
        </ul>
      </li>

      <!-- Item 3 -->
      <li>
        <input type="checkbox" name="html" id="html" />
        <label for="html">Study JavaScript</label>
        <ul class="sub-item">
          <li>
            <a
              href="https://web.dev/learn/javascript"
              target="_blank"
              class="sub-item-link"
              >web.dev JS</a
            >
          </li>
        </ul>
      </li>

      <!-- Item 4 -->
      <li>
        <input type="checkbox" name="html" id="html" />
        <label for="html">Study React</label>
        <ul class="sub-item">
          <li>
            <a
              href="https://react.dev/learn"
              target="_blank"
              class="sub-item-link"
              >React</a
            >
          </li>
        </ul>
      </li>
    </ul>
  </body>
</html>
