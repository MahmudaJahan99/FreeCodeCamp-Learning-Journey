<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playing Cards</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="playing-cards">
      <!-- Card 1 -->
      <div class="card">
        <div class="left">
          <span>A</span>
          <span>♠</span>
        </div>
        <div class="middle">
          <span class="big">♠</span>
        </div>
        <div class="right">
          <span class="upside-down">♠</span>
          <span class="upside-down">A</span>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="card">
        <div class="left">
          <span>2</span>
          <span>♣</span>
        </div>
        <div class="middle">
          <span class="big">♣</span>
          <span class="big upside-down">♣</span>
        </div>
        <div class="right">
          <span class="upside-down">♣</span>
          <span class="upside-down">2</span>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="card red">
        <div class="left">
          <span>3</span>
          <span>♥</span>
        </div>
        <div class="middle">
          <span class="big">♥</span>
          <span class="big">♥</span>
          <span class="big upside-down">♥</span>
        </div>
        <div class="right">
          <span class="upside-down">♥</span>
          <span class="upside-down">3</span>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="card">
        <div class="left">
          <span>4</span>
          <span>♣</span>
        </div>
        <div class="middle">
          <span class="big">♣♣</span>
          <span class="big upside-down">♣♣</span>
        </div>
        <div class="right">
          <span class="upside-down">♣</span>
          <span class="upside-down">4</span>
        </div>
      </div>

      <!-- Card 5 -->
      <div class="card red">
        <div class="left">
          <span>5</span>
          <span>♦</span>
        </div>
        <div class="middle">
          <span class="big">♦♦</span>
          <span class="big upside-down">♦</span>
          <span class="big">♦♦</span>
        </div>
        <div class="right">
          <span class="upside-down">♦</span>
          <span class="upside-down">5</span>
        </div>
      </div>
    </main>
  </body>
</html>
