<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selection Feature Page</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Feature Selection</h1>
    </header>

    <main>
      <div class="feature-card-container">
        <label for="cloud-storage" class="feature-card">
          <input type="checkbox" name="cloud-storage" id="cloud-storage" />
          <strong>Cloud Storage</strong>
          <span>100 Gigabyte secure storage</span>
        </label>

        <label for="dedicated-support" class="feature-card">
          <input
            type="checkbox"
            name="dedicated-support"
            id="dedicated-support"
          />
          <strong>Dedicated Support</strong>
          <span>24/7 customer help</span>
        </label>

        <label for="advanced-analytics" class="feature-card">
          <input
            type="checkbox"
            name="advanced-analytics"
            id="advanced-analytics"
          />
          <strong>Advanced Analytics</strong>
          <span>Insights & reports</span>
        </label>

        <label for="custom-user-themes" class="feature-card">
          <input
            type="checkbox"
            name="custom-user-themes"
            id="custom-user-themes"
          />
          <strong>Custom User Themes</strong>
          <span>Personalized dashboard design</span>
        </label>

        <label for="multi-user-collab" class="feature-card">
          <input
            type="checkbox"
            name="multi-user-collab"
            id="multi-user-collab"
          />
          <strong>Multi-User Collab</strong>
          <span>Team access and sharing</span>
        </label>

        <label for="api-access" class="feature-card">
          <input type="checkbox" name="api-access" id="api-access" />
          <strong>API Access</strong>
          <span>Integrate with your custom built tools</span>
        </label>
      </div>
    </main>
  </body>
</html>
