<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Is it a Palindrome?</h1>

      <!-- Palindrome checker box -->
      <div class="palindrome-div">
        <label for="text-input">Enter text to check for a palindrome: </label>
        <div>
          <input type="text" class="palindrome-input" id="text-input" />
          <button class="check-btn" id="check-btn">Check</button>
        </div>
        <p class="result" id="result"></p>
      </div>

      <!-- palindrome explaination -->
      <div class="palindrome-definition">
        <p>
          A <em>palindrome</em> is a word or sentence that's spelled the same
          way both forward and backward, ignoring punctuation, case, and
          spacing.
        </p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
