<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Form</title>
  </head>
  <body>
    <header>
      <h1 id="title">freeCodeCamp Survey Form</h1>
      <p id="description">
        Thank you for taking the time to help us improve the platform
      </p>
    </header>
    <main>
      <form action="" id="survey-form">
        <!-- Name -->
        <label for="name" id="name-label"> Name </label>
        <input
          type="text"
          name="name"
          id="name"
          placeholder="Enter your name"
          required
        />
        <br />

        <!-- Email -->
        <label for="email" id="email-label"> Email </label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter your Email"
          required
        />
        <br />

        <!-- Age -->
        <label for="number" id="number-label"> Age(optional) </label>
        <input
          type="number"
          name="number"
          id="number"
          placeholder="Age"
          min="10"
          max="99"
          required
        />

        <!-- Role -->
        <p>
          <label for="dropdown">
            Which option best describes your current role?
          </label>
        </p>
        <p>
          <select name="dropdown" id="dropdown">
            <option value="" disabled selected>Select current role</option>
            <option value="student">Student</option>
            <option value="job">Full Time Job</option>
            <option value="learner">Full Time Learner</option>
            <option value="notSay">Prefer not to say</option>
            <option value="other">Other</option>
          </select>
        </p>

        <!-- FCC Recommend -->
        <p>Would you recommend freeCodeCamp to a friend?</p>
        <input
          type="radio"
          name="fccRecommend"
          id="definitely"
          value="Definitely"
        />
        <label for="definitely">Definitely</label>
        <input type="radio" name="fccRecommend" id="maybe" value="Maybe" />
        <label for="maybe">Maybe</label>
        <input type="radio" name="fccRecommend" id="notSure" value="Not Sure" />
        <label for="notSure">Not Sure</label>

        <!-- FCC Feature -->
        <p>
          <label for="feature-dropdown">
            What is your favorite feature of freeCodeCamp?
          </label>
        </p>
        <p>
          <select name="feature-dropdown" id="feature-dropdown">
            <option value="" disabled selected>Select an option</option>
            <option value="challenges">Challenges</option>
            <option value="projects">Projects</option>
            <option value="community">Community</option>
            <option value="openSource">Open Source</option>
          </select>
        </p>

        <!-- Checkbox -->
        <p>
          <label for="dropdown">
            What would you like to see improved? (Check all that apply)
          </label>
        </p>
        <p>
          <input
            type="checkbox"
            id="frontendProjects"
            name="frontendProjects"
            value="Front-end Projects"
          />
          <label for="frontendProjects">Front-end Projects</label>

          <input
            type="checkbox"
            id="backendProjects"
            name="backendProjects"
            value="Back-end Projects"
          />
          <label for="backendProjects">Back-end Projects</label>

          <input
            type="checkbox"
            id="dataVisualization"
            name="dataVisualization"
            value="Data Visualization"
          />
          <label for="dataVisualization">Data Visualization</label>

          <input
            type="checkbox"
            id="challanges"
            name="challanges"
            value="Challanges"
          />
          <label for="challanges">Challanges</label>

          <input
            type="checkbox"
            id="openSourceCommunity"
            name="openSourceCommunity"
            value="Open Source Community"
          />
          <label for="openSourceCommunity">Open Source Community</label>

          <input
            type="checkbox"
            id="gitterHelpRooms"
            name="gitterHelpRooms"
            value="Gitter Help Rooms"
          />
          <label for="gitterHelpRooms">Gitter Help Rooms</label>

          <input type="checkbox" id="videos" name="videos" value="Videos" />
          <label for="videos">Videos</label>

          <input
            type="checkbox"
            id="cityMeetups"
            name="cityMeetups"
            value="City Meetups"
          />
          <label for="cityMeetups">City Meetups</label>

          <input type="checkbox" id="wiki" name="wiki" value="Wiki" />
          <label for="wiki">Wiki</label>

          <input type="checkbox" id="forum" name="forum" value="Forum" />
          <label for="forum">Forum</label>

          <input
            type="checkbox"
            id="additionalCourses"
            name="additionalCourses"
            value="Additional Courses"
          />
          <label for="additionalCourses">Additional Courses</label>
          <br />
        </p>

        <!-- Comments -->
        <p>
          <label for="comments">Any comments or suggestions?</label>
        </p>

        <p>
          <textarea
            name="comments"
            id="comments"
            placeholder="Enter your comment here..."
          ></textarea>
        </p>
        <button id="submit" type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
